name: Test APK Build and Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/test-apk-release.yml'
      - 'src/**'
      - 'tools/**'
      - 'Makefile'
      - 'VERSION'
      - 'Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show version
        id: version
        shell: bash
        run: echo "version=$(tr -d ' \t\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build APK container
        run: docker compose -f tools/docker/compose.yaml build apk

      - name: Build APK
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: docker compose -f tools/docker/compose.yaml run --rm apk

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          find build -maxdepth 2 -type f -name '*.apk' -print
          test -n "$(find build -maxdepth 2 -type f -name '*.apk' -print -quit)"
          file "$(find build -maxdepth 2 -type f -name '*.apk' -print -quit)"

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilksongAndroid-test-apk-${{ steps.version.outputs.version }}
          path: build/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease for testing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test APK build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: build/*.apk
          fail_on_unmatched_files: true
